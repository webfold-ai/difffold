[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "difffold"
description = "Line diff as an edit script, Git-compatible unified patches, three-way merge and tree edit distance, with difffold's engines."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dynamic = ["version"]

[tool.maturin]
features = ["python"]
module-name = "difffold"
