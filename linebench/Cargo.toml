[package]
name = "linebench"
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]
difffold = { path = ".." }
similar = "3"
imara-diff = { version = "0.2", optional = true }
imara-diff-01 = { package = "imara-diff", version = "0.1.8", optional = true }
fast_rsync = "0.2"
qbsdiff = "1"
flate2 = "1"
apted = "0.1"
tree-edit-distance = "0.4"
tree-sitter = "0.27"
tree-sitter-java = "0.23"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"



[features]
# `imara-diff` is the line-diff baseline. Both of its APIs are supported and either can be built:
# 0.1 (`diff` with a sink, the default: the benchmark results were produced on 0.1.8) and 0.2
# (`Diff::compute`). With both on, 0.2 is used.
default = ["imara-01"]
imara-02 = ["dep:imara-diff"]
imara-01 = ["dep:imara-diff-01"]

[[bin]]
name = "mergebench"
path = "src/mergebench.rs"

[[bin]]
name = "linebench"
path = "src/main.rs"

[[bin]]
name = "syncbench"
path = "src/syncbench.rs"

[[bin]]
name = "tedbench"
path = "src/tedbench.rs"
