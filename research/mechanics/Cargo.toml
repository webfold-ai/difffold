[package]
name = "mechanics"
version = "0.0.0"
edition = "2021"
rust-version = "1.89"
publish = false
description = "Research harness: why difffold's tree mapping differs from OmniDiff's hand-authored ground truth."

[dependencies]
difffold = { path = "../..", features = ["ts"] }
tree-sitter = "0.25"
tree-sitter-java = "0.23"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.24"
serde_json = "1"

[workspace]

[profile.release]
debug = 0
