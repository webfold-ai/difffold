name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    # The name is the required status check on the default-branch ruleset. Keep it exact.
    name: Rust checks
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      # The MSRV is the pinned toolchain below; the crate declares rust-version = "1.89".
      TOOLCHAIN: "1.89.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +"$TOOLCHAIN" fmt --all -- --check
      - name: Build
        run: cargo +"$TOOLCHAIN" build --locked --workspace --all-targets
      - name: Test
        run: cargo +"$TOOLCHAIN" test --locked --workspace
      - name: Test with tree-sitter parsers (ts feature)
        run: cargo +"$TOOLCHAIN" test --locked -p difffold --features ts
      - name: Clippy
        run: cargo +"$TOOLCHAIN" clippy --locked --workspace --all-targets -- -D warnings
      - name: Fuzz target contracts (seeded)
        run: cargo +"$TOOLCHAIN" test --locked --manifest-path fuzz/Cargo.toml

  language-bindings:
    name: Python and WebAssembly bindings
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy --target wasm32-unknown-unknown
      - name: Clippy
        run: cargo clippy --locked -p difffold_bindings --features python --all-targets -- -D warnings
      - name: Rust tests (includes real git apply)
        run: cargo test --locked -p difffold_bindings
      - name: Python extension and its tests
        run: difffold_bindings/scripts/test-python.sh
      - name: Install the wasm-bindgen CLI at the locked version
        run: |
          v="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')"
          cargo install --locked wasm-bindgen-cli --version "$v"
      - name: WebAssembly module and its tests
        run: |
          difffold_bindings/scripts/build-wasm.sh
          node difffold_bindings/tests/wasm/test.mjs
