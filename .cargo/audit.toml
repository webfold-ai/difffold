# cargo-audit policy. CI runs `cargo audit --deny warnings` with no ignores.
#
# The git2-based xdiff baseline that used to need RUSTSEC-2026-0183/-0184 exceptions now lives
# in tools/xdiff-baseline, which has its own Cargo.lock and is not part of the root workspace.
# The root lock file therefore has no git2 and no advisory exceptions.
[advisories]
ignore = []
